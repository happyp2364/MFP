    <script type="application/ld+json">

      "potentialAction": {

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>
      (function() {
        try {
          var mode = localStorage.getItem('mfp_theme_mode_pref');
          var isDark = false;
          if (mode === 'dark') {
            isDark = true;
          } else if (mode === 'light') {
            isDark = false;
          } else {
            var h = new Date().getHours();
            if (h >= 20 || h < 5) isDark = true;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
